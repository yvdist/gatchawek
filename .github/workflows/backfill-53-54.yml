name: Backfill 53-54 (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Post PRs #53 and #54 to #bot-changelog (oldest first)
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG_WEBHOOK_URL: ${{ secrets.CHANGELOG_WEBHOOK_URL }}
        run: pnpm exec tsx scripts/backfill-53-54.ts
