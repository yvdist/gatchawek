name: Notify changelog

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.commits != null && github.event.commits != ''
    steps:
      - name: Post commits to #bot-changelog
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG_WEBHOOK_URL: ${{ secrets.CHANGELOG_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CHANGELOG_WEBHOOK_URL:-}" ]; then
            echo "CHANGELOG_WEBHOOK_URL not set; skipping."
            exit 0
          fi

          N=$(jq '.commits | length' "$GITHUB_EVENT_PATH")
          if [ "$N" -eq 0 ]; then
            echo "No commits in push event; skipping."
            exit 0
          fi
          REPO="${GITHUB_REPOSITORY:-}"

          # Try to resolve the merged PR for the head commit (squash merges
          # carry "(#NNN)" in the message). Fall back to a plain commit list.
          HEAD_MSG=$(jq -r '.head_commit.message // ""' "$GITHUB_EVENT_PATH")
          PR_NUM=$(printf '%s' "$HEAD_MSG" | grep -oE '\(#[0-9]+\)' | grep -oE '[0-9]+' | head -1 || true)

          if [ -n "$PR_NUM" ] && PR_JSON=$(gh pr view "$PR_NUM" --json title,body,mergedAt,commits 2>/dev/null); then
            echo "Resolved PR #$PR_NUM for rich changelog post."
            TITLE=$(jq -r '.title' <<<"$PR_JSON")
            BODY=$(jq -r '.body // ""' <<<"$PR_JSON")
            MERGED_AT=$(jq -r '.mergedAt' <<<"$PR_JSON")

            # Summary: first paragraph (skip headings), backticks stripped.
            SUMMARY=$(awk '
              /^#{1,3} / || /^$/ { if (n) exit; next }
              /^[-*] / || /^[0-9]+\. / { if (n) exit; next }
              { gsub(/`/, ""); n=1; print }
            ' <<<"$BODY" | head -c 900)

            HIGHLIGHTS=$(grep -E '^\s*([-*]|[0-9]+\.)\s+' <<<"$BODY" | head -4 \
              | sed -E 's/^\s*([-*]|[0-9]+\.)\s+//; s/`([^`]*)`/\1/g' | cut -c1-220 || true)
            [ -z "$HIGHLIGHTS" ] && HIGHLIGHTS="(none)"

            COMMITS=$(jq -r --arg repo "$REPO" '.commits[:5][] |
              "`\(.oid[0:7])` \(.messageHeadline[0:200]) ([view commit](https://github.com/\($repo)/commit/\(.oid)))"' \
              <<<"$PR_JSON")

            jq -n \
              --arg msg "📦 PR #${PR_NUM} merged — ${TITLE}" \
              --arg title "#${PR_NUM} ${TITLE}" \
              --arg desc "${SUMMARY:-$TITLE}" \
              --arg hl "$HIGHLIGHTS" \
              --arg commits "$COMMITS" \
              --arg merged "$MERGED_AT" \
              '{
                content: $msg,
                allowed_mentions: { parse: [] },
                embeds: [{
                  title: $title[0:256],
                  description: $desc[0:2000],
                  fields: (
                    [{ name: "📌 Summary", value: ($desc[0:1024]), inline: false }]
                    + (if $hl != "(none)" then [{
                        name: "✨ Highlights",
                        value: (($hl | split("\n") | map("• " + .) | join("\n"))[0:1024]),
                        inline: false
                      }] else [] end)
                    + [{ name: "📝 Commits", value: ($commits[0:1024]), inline: false }]
                  ),
                  timestamp: $merged
                }]
              }' > /tmp/changelog-payload.json
          else
            echo "No PR resolved; using plain commit list ($N commit(s))."
            jq -n \
              --arg branch "${GITHUB_REF_NAME:-main}" \
              --slurpfile ev "$GITHUB_EVENT_PATH" \
              --arg repo "$REPO" \
              '
              ($ev[0].commits) as $commits
              | ($commits | length) as $n
              | ($commits[:10]) as $shown
              | {
                  content: "🚀 Bot update @ \($branch) (\($n) commit)",
                  allowed_mentions: { parse: [] },
                  embeds: [{
                    title: "New changes on main",
                    fields: ($shown | map({
                      name: "\((.id // "")[0:7]) \(((.message // "") | split("\n")[0] | .[0:240]))",
                      value: "\(.author.name // .author.username // "unknown") · [view commit](https://github.com/\($repo)/commit/\(.id // ""))"
                    }))
                  }
                  + (if $n > 10
                     then { footer: { text: "… and \($n - 10) more commit(s)" } }
                     else {} end)
                  ]
                }
              ' > /tmp/changelog-payload.json
          fi

          echo "Payload preview:"
          jq -c '{ content, fields: (.embeds[0].fields | length) }' /tmp/changelog-payload.json

          CODE=$(curl -sS -o /tmp/changelog-resp.txt -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            --data @/tmp/changelog-payload.json \
            "${CHANGELOG_WEBHOOK_URL}?wait=true")
          if [ "${CODE:0:1}" != "2" ]; then
            echo "Discord webhook POST failed: HTTP $CODE"
            cat /tmp/changelog-resp.txt
            exit 1
          fi
          echo "Posted to #bot-changelog (HTTP $CODE)."
