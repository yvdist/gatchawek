name: Deploy worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # A spent free-tier read quota makes even the migration bookkeeping
      # SELECT fail; skipping the step once is better than blocking the
      # deploy that fixes the read volume. Any other failure still fails.
      - name: Apply D1 migrations (remote)
        run: |
          set +e
          output=$(pnpm exec wrangler d1 migrations apply DB --remote 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ] && echo "$output" | grep -q "exceeded D1's free tier daily row read limit"; then
            echo "::warning::D1 daily row-read quota exhausted — skipping this run's migrations."
            exit 0
          fi
          exit "$status"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy worker
        run: pnpm deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Register Discord commands
        run: |
          if [ -z "${DISCORD_APPLICATION_ID:-}" ] || [ -z "${DISCORD_BOT_TOKEN:-}" ] || [ -z "${GUILD_ID:-}" ]; then
            echo "Discord command secrets not set; skipping registration."
            exit 0
          fi
          pnpm register
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
